<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Flashcards</title>
    <style> 
        :root {
            --bg-color: #f0f2f5; --text-color: #333; --card-bg: white;
            --input-bg: white; --input-text: #333; --input-border: #ccc;
            --shadow-color: rgba(0,0,0,0.05); --hint-text: #666;
        }
        body.dark-theme {
            --bg-color: #18191a; --text-color: #e4e6eb; --card-bg: #242526;
            --input-bg: #3a3b3c; --input-text: #e4e6eb; --input-border: #555;
            --shadow-color: rgba(0,0,0,0.3); --hint-text: #b0b3b8;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 60px 20px 40px; margin: 0; transition: background-color 0.3s, color 0.3s; }
        h1, h2 { color: var(--text-color); margin-bottom: 20px; text-align: center; }
        
        .top-controls { position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; }
        .ctrl-btn { background-color: var(--card-bg); color: var(--text-color); border: 1px solid var(--input-border); border-radius: 20px; padding: 5px 15px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 2px 5px var(--shadow-color); }
        .ctrl-btn:hover { filter: brightness(0.9); }
        
        .view { display: none; width: 100%; max-width: 1200px; flex-direction: column; align-items: center; }
        .view.active { display: flex; }
        
        .add-card-form { display: flex; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px var(--shadow-color); transition: background-color 0.3s; }
        .add-card-form input, .add-card-form select { padding: 10px 15px; font-size: 1rem; border: 1px solid var(--input-border); border-radius: 8px; outline: none; background: var(--input-bg); color: var(--input-text); }
        .btn { padding: 10px 20px; font-size: 1rem; font-weight: 600; background-color: #2193b0; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #1a7a92; }
        
        .quiz-buttons-main { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
        .btn-quiz { background-color: #6c757d; font-size: 1.1rem; padding: 15px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-quiz:hover { filter: brightness(1.1); }
        .btn-quiz-srs { background-color: #ff5f6d; } /* Czerwony wyróżniony dla SRS */
        .btn-quiz-hard { background-color: #dc3545; }
        
        .btn-hint { background-color: #ffc107; color: #333; }
        .btn-hint:disabled { background-color: #ffe8a1; color: #999; cursor: not-allowed; }
        .btn-back { background-color: #6c757d; margin-bottom: 20px; align-self: flex-start; }
        
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; width: 100%; max-width: 900px; margin-bottom: 30px; }
        .category-card { background: var(--card-bg); padding: 20px; text-align: center; border-radius: 12px; cursor: pointer; font-weight: bold; color: var(--text-color); box-shadow: 0 4px 8px var(--shadow-color); transition: 0.2s; font-size: 1.1rem; }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px var(--shadow-color); color: #2193b0; }

        #category-search { width: 100%; max-width: 400px; padding: 12px 15px; margin: 10px 0 25px; font-size: 1.1rem; border: 2px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--input-text); outline: none; transition: border-color 0.3s; }
        #category-search:focus { border-color: #2193b0; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 100%; }
        
        .flashcard { background-color: transparent; width: 100%; height: 150px; perspective: 1000px; cursor: pointer; position: relative; }
        .star-btn { position: absolute; top: 10px; right: 10px; font-size: 1.5rem; cursor: pointer; z-index: 10; opacity: 0.2; transition: 0.2s; text-shadow: 0 0 2px rgba(255,255,255,0.5); user-select: none; }
        .star-btn.active { opacity: 1; color: #ffeb3b; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .audio-btn { position: absolute; top: 10px; left: 10px; font-size: 1.5rem; cursor: pointer; z-index: 10; opacity: 0.5; transition: 0.2s; text-shadow: 0 0 2px rgba(255,255,255,0.5); user-select: none; }
        .audio-btn:hover { opacity: 1; transform: scale(1.1); }

        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; border-radius: 12px; box-shadow: 0 4px 8px var(--shadow-color); }
        .flashcard.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 600; border-radius: 12px; padding: 10px; box-sizing: border-box; }
        .flashcard[data-category="sentences"] .card-front, .flashcard[data-category="sentences"] .card-back { font-size: 1rem; }
        .card-front { background: linear-gradient(135deg, #ff5f6d, #ffc371); color: white; }
        .card-back { background: linear-gradient(135deg, #2193b0, #6dd5ed); color: white; transform: rotateY(180deg); }
        .pronunciation { font-size: 0.9rem; opacity: 0.85; font-weight: normal; margin-top: 8px; font-style: italic; }

        .quiz-container { background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow-color); text-align: center; width: 100%; max-width: 600px; margin-top: 20px; transition: background-color 0.3s; }
        .quiz-word { font-size: 2.5rem; margin-bottom: 25px; color: #2193b0; font-weight: bold; }
        .quiz-input { padding: 15px; width: 80%; font-size: 1.2rem; margin-bottom: 20px; border: 2px solid var(--input-border); border-radius: 8px; text-align: center; outline: none; transition: 0.3s; background: var(--input-bg); color: var(--input-text); }
        .quiz-input:focus { border-color: #2193b0; }
        .quiz-feedback { margin-top: 20px; font-size: 1.3rem; font-weight: bold; min-height: 30px; }
        .quiz-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .correct { color: #28a745; }
        .incorrect { color: #dc3545; }
        #loading-status { color: var(--hint-text); margin-top: 15px; }
    </style>
</head>
<body>

    <div class="top-controls">
        <button id="lang-btn" class="ctrl-btn" onclick="toggleLanguage()">PL</button>
        <button id="theme-btn" class="ctrl-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <!-- MAIN MENU VIEW -->
    <div id="view-home" class="view active">
        <h1 data-i18n="title">Language Flashcards</h1>
        
        <div class="add-card-form">
            <input type="text" id="en-input" data-i18n-placeholder="enPlaceholder" placeholder="English (e.g. cat)">
            <input type="text" id="es-input" data-i18n-placeholder="esPlaceholder" placeholder="Spanish (e.g. gato)">
            <input type="text" id="fon-input" data-i18n-placeholder="fonPlaceholder" placeholder="Pronunciation (e.g. [ga-to])">
            <select id="category-select">
                <option value="verbs" data-i18n="catVerbs">Verbs</option>
                <option value="nouns" data-i18n="catNouns">Nouns</option>
                <option value="adjectives" data-i18n="catAdjectives">Adjectives</option>
                <option value="numbers" data-i18n="catNumbers">Numbers</option>
                <option value="phrases" data-i18n="catPhrases">Phrases</option>
                <option value="questions" data-i18n="catQuestions">Questions</option>
                <option value="linking_words" data-i18n="catLinking">Linking words</option>
                <option value="sentences" data-i18n="catSentences">Sentences</option>
            </select>
            <button class="btn" id="add-btn" data-i18n="addBtn">Add flashcard</button>
        </div>

        <div class="nav-grid">
            <div class="category-card" onclick="openCategory('verbs')" data-i18n="catVerbs">Verbs</div>
            <div class="category-card" onclick="openCategory('nouns')" data-i18n="catNouns">Nouns</div>
            <div class="category-card" onclick="openCategory('adjectives')" data-i18n="catAdjectives">Adjectives</div>
            <div class="category-card" onclick="openCategory('numbers')" data-i18n="catNumbers">Numbers</div>
            <div class="category-card" onclick="openCategory('phrases')" data-i18n="catPhrases">Phrases</div>
            <div class="category-card" onclick="openCategory('questions')" data-i18n="catQuestions">Questions</div>
            <div class="category-card" onclick="openCategory('linking_words')" data-i18n="catLinking">Linking words</div>
            <div class="category-card" onclick="openCategory('sentences')" data-i18n="catSentences">Sentences</div>
        </div>

        <div class="quiz-buttons-main">
            <!-- Dodany główny przycisk do SRS -->
            <button class="btn btn-quiz btn-quiz-srs" onclick="startQuiz('srs')" data-i18n="checkSrs">Smart Review (SRS) 🔥</button>
            <button class="btn btn-quiz" onclick="startQuiz('all')" data-i18n="checkAll">Check all</button>
            <button class="btn btn-quiz btn-quiz-hard" onclick="startQuiz('hard')" data-i18n="checkHard">Only hard ⭐</button>
        </div>
        <p id="loading-status" data-i18n="loading">Connecting to Google Sheets...</p>
    </div>

    <!-- CATEGORY VIEW -->
    <div id="view-category" class="view">
        <button class="btn btn-back" onclick="showView('view-home')" data-i18n="backMenu">⬅ Back to menu</button>
        <h2 id="category-title">Category</h2>
        <input type="text" id="category-search" data-i18n-placeholder="searchSentences" placeholder="Search sentences..." onkeyup="filterCards()" style="display:none;">
        <div class="grid-container" id="flashcards-container"></div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="view-quiz" class="view">
        <button class="btn btn-back" onclick="showView('view-home')" data-i18n="stopQuiz">⬅ Stop & Go back</button>
        <h2 id="quiz-title" data-i18n="testKnowledge">Test your knowledge</h2>
        
        <div class="quiz-container">
            <div class="quiz-word" id="quiz-en-word">...</div>
            <input type="text" id="quiz-es-input" class="quiz-input" data-i18n-placeholder="typeSpanish" placeholder="Type in Spanish..." autocomplete="off">
            <br>
            <div class="quiz-buttons">
                <button class="btn btn-hint" id="quiz-hint-btn" data-i18n="hintBtn">Hint (1 letter)</button>
                <button class="btn" id="quiz-check-btn" data-i18n="checkBtn">Check</button>
                <button class="btn" id="quiz-next-btn" style="display:none; background-color: #28a745;" data-i18n="nextBtn">Next word</button>
            </div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
    </div>

    <script>
        // === W TYM MIEJSCU PODMIEŃ LINK NA SWÓJ ===
        const API_URL = "https://script.google.com/macros/s/AKfycbwa3Xq92PIir6MRUVsSH9tIN1tVoWY9Ij_vhikBOxbqnCKVLSWFhgUjDVIO8ku3RYGF/exec";

        const dictionary = {
            en: {
                title: "Language Flashcards", enPlaceholder: "English (e.g. cat)", esPlaceholder: "Spanish (e.g. gato)", fonPlaceholder: "Pronunciation (e.g. [ga-to])",
                addBtn: "Add flashcard", catVerbs: "Verbs", catNouns: "Nouns", catAdjectives: "Adjectives", catNumbers: "Numbers", catPhrases: "Phrases", catQuestions: "Questions", catLinking: "Linking words", catSentences: "Sentences",
                checkSrs: "Smart Review (SRS) 🔥", checkAll: "Check all", checkHard: "Only hard ⭐",
                loading: "Connecting to Google Sheets...", backMenu: "⬅ Back to menu", stopQuiz: "⬅ Stop & Go back", testKnowledge: "Test your knowledge",
                typeSpanish: "Type in Spanish...", hintBtn: "Hint (1 letter)", checkBtn: "Check", nextBtn: "Next word", alertFill: "Please fill at least English and Spanish fields!",
                alertAdded: "New flashcard added!", alertNoCards: "No flashcards in the database!", alertNoHard: "No hard flashcards (with star) found!",
                alertNoSrs: "You're all caught up! No cards to review today. 🎉", testHardTitle: "Test: Only Hard Words ⭐", testSrsTitle: "Smart Review: Due Today 🔥",
                loadedSuccess: "All words loaded! ✅", loadedError: "Error loading data from Google Sheets :(", noCardsCat: "No flashcards in this category.",
                quizCorrect: "Correct! 🎉", quizWrong: "Wrong! Correct answer: ", quizEnd: "No more flashcards! Returning...", searchSentences: "Search sentences..."
            },
            pl: {
                title: "Fiszki Językowe", enPlaceholder: "Angielski (np. cat)", esPlaceholder: "Hiszpański (np. gato)", fonPlaceholder: "Wymowa (np. [ga-to])",
                addBtn: "Dodaj fiszkę", catVerbs: "Czasowniki", catNouns: "Rzeczowniki", catAdjectives: "Przymiotniki", catNumbers: "Liczebniki", catPhrases: "Frazy", catQuestions: "Pytania", catLinking: "Słówka łączące", catSentences: "Zdania",
                checkSrs: "Inteligentna powtórka (SRS) 🔥", checkAll: "Sprawdź wszystkie", checkHard: "Tylko trudne ⭐",
                loading: "Łączenie z bazą Google Sheets...", backMenu: "⬅ Wróć do menu", stopQuiz: "⬅ Przerwij i wróć", testKnowledge: "Sprawdź swoją wiedzę",
                typeSpanish: "Wpisz po hiszpańsku...", hintBtn: "Podpowiedź (1 litera)", checkBtn: "Sprawdź", nextBtn: "Następne słowo", alertFill: "Proszę wypełnić przynajmniej pole Angielski i Hiszpański!",
                alertAdded: "Dodano nową fiszkę!", alertNoCards: "Brak fiszek w bazie!", alertNoHard: "Brak trudnych fiszek (z gwiazdką)!",
                alertNoSrs: "Wszystko umiesz! Brak słówek do powtórki na dzisiaj. 🎉", testHardTitle: "Test: Tylko trudne ⭐", testSrsTitle: "Inteligentna Powtórka 🔥",
                loadedSuccess: "Pobrano wszystkie słówka! ✅", loadedError: "Błąd pobierania danych z bazy :(", noCardsCat: "Brak fiszek w tej kategorii.",
                quizCorrect: "Dobrze! 🎉", quizWrong: "Źle! Poprawna odpowiedź: ", quizEnd: "Koniec fiszek! Wracamy...", searchSentences: "Szukaj zdań..."
            }
        };

        let currentLang = localStorage.getItem('appLang') || 'en';
        let currentTheme = localStorage.getItem('appTheme') || 'light';
        let activeCategory = '';

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dictionary[currentLang][key]) el.textContent = dictionary[currentLang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dictionary[currentLang][key]) el.placeholder = dictionary[currentLang][key];
            });
            document.getElementById('lang-btn').textContent = currentLang === 'en' ? 'PL' : 'EN';
        }

        function toggleLanguage() { currentLang = currentLang === 'en' ? 'pl' : 'en'; localStorage.setItem('appLang', currentLang); applyLanguage(); }
        function applyTheme() {
            if (currentTheme === 'dark') { document.body.classList.add('dark-theme'); document.getElementById('theme-btn').textContent = '☀️'; }
            else { document.body.classList.remove('dark-theme'); document.getElementById('theme-btn').textContent = '🌙'; }
        }
        function toggleTheme() { currentTheme = currentTheme === 'light' ? 'dark' : 'light'; localStorage.setItem('appTheme', currentTheme); applyTheme(); }

        applyLanguage(); applyTheme();

        const state = { verbs: [], nouns: [], adjectives: [], numbers: [], phrases: [], questions: [], linking_words: [], sentences: [] };
        let quizCards = [];
        let currentQuizIndex = 0;
        let hintCount = 0;

        async function initApp() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                data.forEach(item => {
                    if(state[item.kategoria]) {
                        item.trudne = (item.trudne === true || item.trudne === 'true' || item.trudne === 'TRUE');
                        item.level = parseInt(item.level) || 0; // Wczytywanie poziomu SRS
                        state[item.kategoria].push(item);
                    }
                });
                document.getElementById('loading-status').textContent = dictionary[currentLang].loadedSuccess;
                setTimeout(() => document.getElementById('loading-status').style.display = 'none', 3000);
            } catch (error) {
                document.getElementById('loading-status').textContent = dictionary[currentLang].loadedError;
            }
        }
        initApp();

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function goToSentences(wordToSearch) { openCategory('sentences', wordToSearch); }

        function filterCards() {
            const term = document.getElementById('category-search').value.toLowerCase();
            const cards = document.querySelectorAll('#flashcards-container .flashcard');
            cards.forEach(card => {
                if (card.dataset.es.includes(term) || card.dataset.en.includes(term)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openCategory(categoryName, searchTerm = '') {
            activeCategory = categoryName;
            const title = document.getElementById('category-title');
            const dictKey = 'cat' + categoryName.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
            title.textContent = dictionary[currentLang][dictKey] || categoryName;
            
            const searchInput = document.getElementById('category-search');
            if (categoryName === 'sentences') { searchInput.style.display = 'block'; searchInput.value = searchTerm; }
            else { searchInput.style.display = 'none'; searchInput.value = ''; }

            const container = document.getElementById('flashcards-container');
            container.innerHTML = ''; 

            if (!state[categoryName] || state[categoryName].length === 0) {
                container.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--hint-text);">${dictionary[currentLang].noCardsCat}</p>`;
            } else {
                state[categoryName].forEach(card => {
                    const div = document.createElement('div');
                    div.className = 'flashcard'; div.dataset.category = categoryName;
                    div.dataset.es = card.es.toLowerCase(); div.dataset.en = card.en.toLowerCase();
                    div.onclick = function() { this.classList.toggle('flipped'); };
                    
                    div.ondblclick = function(event) {
                        if (activeCategory !== 'sentences') {
                            let searchWord = card.es.replace(/^(el|la|los|las|un|una|unos|unas)\s+/i, '').trim();
                            goToSentences(searchWord);
                        }
                    };
                    
                    let fonHtml = card.fon ? `<span class="pronunciation">${card.fon}</span>` : '';
                    let isHardClass = card.trudne ? 'active' : '';
                    
                    div.innerHTML = `
                        <div class="audio-btn" onclick="playAudio(event, '${card.es.replace(/'/g, "\\'")}')">🔊</div>
                        <div class="star-btn ${isHardClass}" onclick="toggleHard(event, '${categoryName}', '${card.es.replace(/'/g, "\\'")}')">⭐</div>
                        <div class="card-inner">
                            <div class="card-front">${card.en}</div>
                            <div class="card-back"><span>${card.es}</span>${fonHtml}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            showView('view-category');
            if (searchTerm !== '') filterCards();
        }

        function toggleHard(event, category, esWord) {
            event.stopPropagation();
            const card = state[category].find(c => c.es === esWord);
            if (card) {
                card.trudne = !card.trudne;
                event.target.classList.toggle('active', card.trudne);
                fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'update_trudne', es: card.es, en: card.en, trudne: card.trudne })
                }).catch(err => console.error("Error updating star in the cloud", err));
            }
        }

        document.getElementById('add-btn').addEventListener('click', () => {
            const es = document.getElementById('es-input').value.trim();
            const fon = document.getElementById('fon-input').value.trim();
            const en = document.getElementById('en-input').value.trim();
            const cat = document.getElementById('category-select').value;

            if (es && en) {
                const newCard = { kategoria: cat, es: es, en: en, fon: fon, trudne: false, level: 0, nextReview: new Date().toISOString() };
                state[cat].unshift(newCard); 
                fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'add', ...newCard })
                });
                document.getElementById('es-input').value = ''; document.getElementById('fon-input').value = ''; document.getElementById('en-input').value = '';
                alert(dictionary[currentLang].alertAdded);
                document.getElementById('en-input').focus();
            } else { alert(dictionary[currentLang].alertFill); }
        });

        // --- ZMODYFIKOWANA LOGIKA QUIZU Z SRS ---
        function startQuiz(mode) {
            quizCards = [];
            const now = new Date();

            for (let key in state) {
                if (key !== 'sentences') {
                    let categoryCards = state[key];
                    
                    if (mode === 'hard') {
                        categoryCards = categoryCards.filter(c => c.trudne === true);
                    } else if (mode === 'srs') {
                        categoryCards = categoryCards.filter(c => {
                            if (!c.nextReview) return true; // Jeśli fiszka nie ma daty, wrzuć ją
                            return new Date(c.nextReview) <= now; // Jeśli data minęła, wrzuć do testu
                        });
                    }
                    
                    quizCards = quizCards.concat(categoryCards);
                }
            }

            if (quizCards.length === 0) {
                if (mode === 'hard') alert(dictionary[currentLang].alertNoHard);
                else if (mode === 'srs') alert(dictionary[currentLang].alertNoSrs);
                else alert(dictionary[currentLang].alertNoCards);
                return;
            }

            if (mode === 'hard') document.getElementById('quiz-title').textContent = dictionary[currentLang].testHardTitle;
            else if (mode === 'srs') document.getElementById('quiz-title').textContent = dictionary[currentLang].testSrsTitle;
            else document.getElementById('quiz-title').textContent = dictionary[currentLang].testKnowledge;

            // Mieszanie słówek
            for (let i = quizCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizCards[i], quizCards[j]] = [quizCards[j], quizCards[i]];
            }

            currentQuizIndex = 0;
            loadQuizCard();
            showView('view-quiz');
        }

        function loadQuizCard() {
            hintCount = 0;
            const hintBtn = document.getElementById('quiz-hint-btn');
            hintBtn.style.display = 'inline-block'; hintBtn.disabled = false;

            document.getElementById('quiz-en-word').textContent = quizCards[currentQuizIndex].en;
            document.getElementById('quiz-es-input').value = '';
            document.getElementById('quiz-feedback').textContent = '';
            document.getElementById('quiz-check-btn').style.display = 'inline-block';
            document.getElementById('quiz-next-btn').style.display = 'none';
            
            setTimeout(() => document.getElementById('quiz-es-input').focus(), 100);
        }

        document.getElementById('quiz-hint-btn').addEventListener('click', () => {
            const correctWord = quizCards[currentQuizIndex].es;
            const inputField = document.getElementById('quiz-es-input');
            
            if (hintCount < correctWord.length) {
                hintCount++; inputField.value = correctWord.substring(0, hintCount); inputField.focus();
            }
            if (hintCount >= correctWord.length) { document.getElementById('quiz-hint-btn').disabled = true; }
        });

        function checkAnswer() {
            const answer = document.getElementById('quiz-es-input').value.trim().toLowerCase();
            const correct = quizCards[currentQuizIndex].es.toLowerCase();
            const feedback = document.getElementById('quiz-feedback');
            
            let card = quizCards[currentQuizIndex];
            let isCorrect = (answer === correct);

            // LOGIKA SRS (Obliczanie interwałów)
            let currentLevel = parseInt(card.level) || 0;
            let newLevel = isCorrect ? currentLevel + 1 : 0;
            if (newLevel > 5) newLevel = 5; // Max level 5

            let daysToAdd = 0;
            if (newLevel === 1) daysToAdd = 1;
            else if (newLevel === 2) daysToAdd = 3;
            else if (newLevel === 3) daysToAdd = 7;
            else if (newLevel === 4) daysToAdd = 14;
            else if (newLevel === 5) daysToAdd = 30;

            let nextReviewDate = new Date();
            nextReviewDate.setDate(nextReviewDate.getDate() + daysToAdd);

            // Zapis do stanu lokalnego
            card.level = newLevel;
            card.nextReview = nextReviewDate.toISOString();

            // Zapis do chmury
            fetch(API_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: 'update_srs', es: card.es, en: card.en, level: card.level, nextReview: card.nextReview })
            });

            // Reakcja wizualna i audio
            if (isCorrect) {
                feedback.textContent = dictionary[currentLang].quizCorrect;
                feedback.className = 'quiz-feedback correct';
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utt = new SpeechSynthesisUtterance(quizCards[currentQuizIndex].es);
                    utt.lang = 'es-ES'; utt.rate = 0.9;
                    window.speechSynthesis.speak(utt);
                }
            } else {
                feedback.innerHTML = `${dictionary[currentLang].quizWrong} <b>${quizCards[currentQuizIndex].es}</b>`;
                feedback.className = 'quiz-feedback incorrect';
            }

            document.getElementById('quiz-hint-btn').style.display = 'none';
            document.getElementById('quiz-check-btn').style.display = 'none';
            document.getElementById('quiz-next-btn').style.display = 'inline-block';
            document.getElementById('quiz-next-btn').focus();
        }

        document.getElementById('quiz-check-btn').addEventListener('click', checkAnswer);

        document.getElementById('quiz-es-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('quiz-check-btn').style.display !== 'none') { checkAnswer(); }
                else { document.getElementById('quiz-next-btn').click(); }
            }
        });

        document.getElementById('quiz-next-btn').addEventListener('click', () => {
            currentQuizIndex++;
            if (currentQuizIndex < quizCards.length) {
                loadQuizCard();
            } else {
                document.getElementById('quiz-feedback').textContent = dictionary[currentLang].quizEnd;
                document.getElementById('quiz-feedback').className = 'quiz-feedback correct';
                document.getElementById('quiz-next-btn').style.display = 'none';
                setTimeout(() => showView('view-home'), 2000);
            }
        });

        function playAudio(event, text) {
            event.stopPropagation(); 
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES'; utterance.rate = 0.9; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Your browser does not support audio playback.");
            }
        }
    </script>
</body>
</html>
