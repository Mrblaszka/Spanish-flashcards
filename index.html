<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Flashcards</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1, h2 { color: #333; margin-bottom: 20px; text-align: center; }
        
        .view { display: none; width: 100%; max-width: 1200px; flex-direction: column; align-items: center; }
        .view.active { display: flex; }
        
        .add-card-form {
            display: flex; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; 
            justify-content: center; background: white; padding: 20px; 
            border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .add-card-form input, .add-card-form select {
            padding: 10px 15px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; outline: none;
        }
        .btn {
            padding: 10px 20px; font-size: 1rem; font-weight: 600; background-color: #2193b0;
            color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background-color: #1a7a92; }
        
        .quiz-buttons-main { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
        .btn-quiz { background-color: #ff5f6d; font-size: 1.1rem; padding: 15px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-quiz:hover { background-color: #e04e5a; }
        .btn-quiz-hard { background-color: #dc3545; }
        .btn-quiz-hard:hover { background-color: #c82333; }
        
        .btn-hint { background-color: #ffc107; color: #333; }
        .btn-hint:disabled { background-color: #ffe8a1; color: #999; cursor: not-allowed; }
        .btn-back { background-color: #6c757d; margin-bottom: 20px; align-self: flex-start; }
        
        .nav-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px; width: 100%; max-width: 900px; margin-bottom: 30px;
        }
        .category-card {
            background: white; padding: 20px; text-align: center; border-radius: 12px;
            cursor: pointer; font-weight: bold; color: #444; box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: 0.2s; font-size: 1.1rem;
        }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); color: #2193b0; }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 100%;
        }
        
        .flashcard {
            background-color: transparent; width: 100%; height: 150px; perspective: 1000px;
            cursor: pointer; position: relative;
        }
        
        /* --- Przyciski na fiszce --- */
        .star-btn {
            position: absolute; top: 10px; right: 10px; font-size: 1.5rem;
            cursor: pointer; z-index: 10; opacity: 0.2; transition: 0.2s;
            text-shadow: 0 0 2px rgba(255,255,255,0.5); user-select: none;
        }
        .star-btn.active {
            opacity: 1; color: #ffeb3b; text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .audio-btn {
            position: absolute; top: 10px; left: 10px; font-size: 1.5rem;
            cursor: pointer; z-index: 10; opacity: 0.5; transition: 0.2s;
            text-shadow: 0 0 2px rgba(255,255,255,0.5); user-select: none;
        }
        .audio-btn:hover {
            opacity: 1; transform: scale(1.1);
        }

        .card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s; transform-style: preserve-3d; border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .flashcard.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 600; border-radius: 12px; padding: 10px; box-sizing: border-box;
        }
        .card-front { background: linear-gradient(135deg, #ff5f6d, #ffc371); color: white; }
        .card-back { background: linear-gradient(135deg, #2193b0, #6dd5ed); color: white; transform: rotateY(180deg); }
        .pronunciation { font-size: 0.9rem; opacity: 0.85; font-weight: normal; margin-top: 8px; font-style: italic; }

        .quiz-container {
            background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center; width: 100%; max-width: 600px; margin-top: 20px;
        }
        .quiz-word { font-size: 2.5rem; margin-bottom: 25px; color: #2193b0; font-weight: bold; }
        .quiz-input { padding: 15px; width: 80%; font-size: 1.2rem; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px; text-align: center; outline: none; transition: 0.3s; }
        .quiz-input:focus { border-color: #2193b0; }
        .quiz-feedback { margin-top: 20px; font-size: 1.3rem; font-weight: bold; min-height: 30px; }
        .quiz-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .correct { color: #28a745; }
        .incorrect { color: #dc3545; }
    </style>
</head>
<body>

    <!-- MAIN MENU VIEW -->
    <div id="view-home" class="view active">
        <h1>Language Flashcards</h1>
        
        <div class="add-card-form">
            <input type="text" id="en-input" placeholder="English (e.g. cat)">
            <input type="text" id="es-input" placeholder="Spanish (e.g. gato)">
            <input type="text" id="fon-input" placeholder="Pronunciation (e.g. [ga-to])">
            <select id="category-select">
                <option value="verbs">Verbs</option>
                <option value="nouns">Nouns</option>
                <option value="adjectives">Adjectives</option>
                <option value="numbers">Numbers</option>
                <option value="phrases">Phrases</option>
                <option value="questions">Questions</option>
                <option value="linking_words">Linking words</option>
            </select>
            <button class="btn" id="add-btn">Add flashcard</button>
        </div>

        <div class="nav-grid">
            <div class="category-card" onclick="openCategory('verbs')">Verbs</div>
            <div class="category-card" onclick="openCategory('nouns')">Nouns</div>
            <div class="category-card" onclick="openCategory('adjectives')">Adjectives</div>
            <div class="category-card" onclick="openCategory('numbers')">Numbers</div>
            <div class="category-card" onclick="openCategory('phrases')">Phrases</div>
            <div class="category-card" onclick="openCategory('questions')">Questions</div>
            <div class="category-card" onclick="openCategory('linking_words')">Linking words</div>
        </div>

        <!-- QUIZ BUTTONS -->
        <div class="quiz-buttons-main">
            <button class="btn btn-quiz" onclick="startQuiz(false)">Check yourself (All)</button>
            <button class="btn btn-quiz btn-quiz-hard" onclick="startQuiz(true)">Only hard ⭐</button>
        </div>
        <p id="loading-status" style="color: #666; margin-top: 15px;">Connecting to Google Sheets...</p>
    </div>

    <!-- CATEGORY VIEW -->
    <div id="view-category" class="view">
        <button class="btn btn-back" onclick="showView('view-home')">⬅ Back to menu</button>
        <h2 id="category-title">Category</h2>
        <div class="grid-container" id="flashcards-container"></div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="view-quiz" class="view">
        <button class="btn btn-back" onclick="showView('view-home')">⬅ Stop & Go back</button>
        <h2 id="quiz-title">Test your knowledge</h2>
        
        <div class="quiz-container">
            <div class="quiz-word" id="quiz-en-word">...</div>
            <input type="text" id="quiz-es-input" class="quiz-input" placeholder="Type in Spanish..." autocomplete="off">
            <br>
            <div class="quiz-buttons">
                <button class="btn btn-hint" id="quiz-hint-btn">Hint (1 letter)</button>
                <button class="btn" id="quiz-check-btn">Check</button>
                <button class="btn" id="quiz-next-btn" style="display:none; background-color: #28a745;">Next word</button>
            </div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
    </div>

    <script>
        // === W TYM MIEJSCU PODMIEŃ LINK NA SWÓJ ===
        const API_URL = "https://script.google.com/macros/s/AKfycbwyNkhxYdjVc6xdMzJtwMI9V3HW3kGsJv7T3r86m0oWQbsVzy0fpUQX62_MnKscxfx4/exec";


        const state = {
            verbs: [], nouns: [], adjectives: [], 
            numbers: [], phrases: [], questions: [], linking_words: []
        };

        let quizCards = [];
        let currentQuizIndex = 0;
        let hintCount = 0;

        async function initApp() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                data.forEach(item => {
                    if(state[item.kategoria]) {
                        item.trudne = (item.trudne === true || item.trudne === 'true' || item.trudne === 'TRUE');
                        state[item.kategoria].push(item);
                    }
                });
                document.getElementById('loading-status').textContent = "All words loaded! ✅";
                setTimeout(() => document.getElementById('loading-status').style.display = 'none', 3000);
            } catch (error) {
                document.getElementById('loading-status').textContent = "Error loading data from Google Sheets :(";
            }
        }
        initApp();

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // --- RENDEROWANIE KATEGORII (I FISZEK) ---
        function openCategory(categoryName) {
            const title = document.getElementById('category-title');
            title.textContent = categoryName.charAt(0).toUpperCase() + categoryName.slice(1).replace('_', ' ');
            
            const container = document.getElementById('flashcards-container');
            container.innerHTML = ''; 

            if (!state[categoryName] || state[categoryName].length === 0) {
                container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #777;">No flashcards in this category.</p>';
            } else {
                state[categoryName].forEach(card => {
                    const div = document.createElement('div');
                    div.className = 'flashcard';
                    div.onclick = function() { this.classList.toggle('flipped'); };
                    
                    let fonHtml = card.fon ? `<span class="pronunciation">${card.fon}</span>` : '';
                    let isHardClass = card.trudne ? 'active' : '';
                    
                    div.innerHTML = `
                        <div class="audio-btn" onclick="playAudio(event, '${card.es.replace(/'/g, "\\'")}')">🔊</div>
                        <div class="star-btn ${isHardClass}" onclick="toggleHard(event, '${categoryName}', '${card.es.replace(/'/g, "\\'")}')">⭐</div>
                        <div class="card-inner">
                            <div class="card-front">${card.en}</div>
                            <div class="card-back">
                                <span>${card.es}</span>
                                ${fonHtml}
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            showView('view-category');
        }

        function toggleHard(event, category, esWord) {
            event.stopPropagation();
            
            const card = state[category].find(c => c.es === esWord);
            if (card) {
                card.trudne = !card.trudne;
                event.target.classList.toggle('active', card.trudne);

                fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: 'update_trudne',
                        es: card.es,
                        en: card.en,
                        trudne: card.trudne
                    })
                }).catch(err => console.error("Error updating star in the cloud", err));
            }
        }

        document.getElementById('add-btn').addEventListener('click', () => {
            const es = document.getElementById('es-input').value.trim();
            const fon = document.getElementById('fon-input').value.trim();
            const en = document.getElementById('en-input').value.trim();
            const cat = document.getElementById('category-select').value;

            if (es && en) {
                const newCard = { kategoria: cat, es: es, en: en, fon: fon, trudne: false };
                
                state[cat].unshift(newCard); 
                
                fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: 'add',
                        ...newCard
                    })
                });

                document.getElementById('es-input').value = '';
                document.getElementById('fon-input').value = '';
                document.getElementById('en-input').value = '';
                alert('New flashcard added!');
                document.getElementById('en-input').focus();
            } else {
                alert('Please fill at least English and Spanish fields!');
            }
        });

        // --- QUIZ LOGIC ---
        function startQuiz(onlyHard) {
            quizCards = [];
            for (let key in state) {
                let categoryCards = state[key];
                if (onlyHard) {
                    categoryCards = categoryCards.filter(c => c.trudne === true);
                }
                quizCards = quizCards.concat(categoryCards);
            }

            if (quizCards.length === 0) {
                alert(onlyHard ? 'No hard flashcards (with star) found!' : 'No flashcards in the database!');
                return;
            }

            document.getElementById('quiz-title').textContent = onlyHard ? "Test: Only Hard Words ⭐" : "Test your knowledge";

            for (let i = quizCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizCards[i], quizCards[j]] = [quizCards[j], quizCards[i]];
            }

            currentQuizIndex = 0;
            loadQuizCard();
            showView('view-quiz');
        }

        function loadQuizCard() {
            hintCount = 0;
            const hintBtn = document.getElementById('quiz-hint-btn');
            hintBtn.style.display = 'inline-block';
            hintBtn.disabled = false;

            document.getElementById('quiz-en-word').textContent = quizCards[currentQuizIndex].en;
            
            document.getElementById('quiz-es-input').value = '';
            document.getElementById('quiz-feedback').textContent = '';
            document.getElementById('quiz-check-btn').style.display = 'inline-block';
            document.getElementById('quiz-next-btn').style.display = 'none';
            
            setTimeout(() => document.getElementById('quiz-es-input').focus(), 100);
        }

        document.getElementById('quiz-hint-btn').addEventListener('click', () => {
            const correctWord = quizCards[currentQuizIndex].es;
            const inputField = document.getElementById('quiz-es-input');
            
            if (hintCount < correctWord.length) {
                hintCount++;
                inputField.value = correctWord.substring(0, hintCount);
                inputField.focus();
            }
            if (hintCount >= correctWord.length) { document.getElementById('quiz-hint-btn').disabled = true; }
        });

        function checkAnswer() {
            const answer = document.getElementById('quiz-es-input').value.trim().toLowerCase();
            const correct = quizCards[currentQuizIndex].es.toLowerCase();
            const feedback = document.getElementById('quiz-feedback');

            if (answer === correct) {
                feedback.textContent = 'Correct! 🎉';
                feedback.className = 'quiz-feedback correct';
            } else {
                feedback.innerHTML = `Wrong! Correct answer: <b>${quizCards[currentQuizIndex].es}</b>`;
                feedback.className = 'quiz-feedback incorrect';
            }

            document.getElementById('quiz-hint-btn').style.display = 'none';
            document.getElementById('quiz-check-btn').style.display = 'none';
            document.getElementById('quiz-next-btn').style.display = 'inline-block';
            document.getElementById('quiz-next-btn').focus();
        }

        document.getElementById('quiz-check-btn').addEventListener('click', checkAnswer);

        document.getElementById('quiz-es-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('quiz-check-btn').style.display !== 'none') { checkAnswer(); }
                else { document.getElementById('quiz-next-btn').click(); }
            }
        });

        document.getElementById('quiz-next-btn').addEventListener('click', () => {
            currentQuizIndex++;
            if (currentQuizIndex < quizCards.length) {
                loadQuizCard();
            } else {
                document.getElementById('quiz-feedback').textContent = 'No more flashcards! Returning...';
                document.getElementById('quiz-feedback').className = 'quiz-feedback correct';
                document.getElementById('quiz-next-btn').style.display = 'none';
                setTimeout(() => showView('view-home'), 2000);
            }
        });

        // --- FUNKCJA ODTWARZANIA MOWY ---
        function playAudio(event, text) {
            event.stopPropagation(); // Blokuje odwrócenie fiszki przy kliknięciu w głośnik
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES'; // Kastylijski
                utterance.rate = 0.9; 
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Your browser does not support audio playback.");
            }
        }
    </script>
</body>
</html>
